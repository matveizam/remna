(() => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="1024" height="896">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2dfcfd"/>
        <stop offset="45%" stop-color="#2ca4ff"/>
        <stop offset="80%" stop-color="#5a6ef5"/>
        <stop offset="100%" stop-color="#8b5cf6"/>
      </linearGradient>
      <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1000" height="900">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="36" result="b3"/>
        <feMerge>
          <feMergeNode in="b3"/>
          <feMergeNode in="b2"/>
          <feMergeNode in="b1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <mask id="eyeL">
        <circle cx="310" cy="365" r="38" fill="white"/>
        <circle cx="326" cy="356" r="19" fill="black"/>
      </mask>
      <mask id="eyeR">
        <circle cx="490" cy="365" r="38" fill="white"/>
        <circle cx="506" cy="356" r="19" fill="black"/>
      </mask>
    </defs>
    <g filter="url(#glow)">
      <path d="M 400 560 L 230 560 C 145 560 95 505 95 440 C 95 375 145 330 205 330 C 218 260 235 190 252 145 C 260 122 285 122 298 145 C 320 180 345 205 400 205 C 455 205 480 180 502 145 C 515 122 540 122 548 145 C 565 190 582 260 595 330 C 655 330 705 375 705 440 C 705 505 655 560 570 560 Z" fill="none" stroke="url(#g)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="310" cy="365" r="38" fill="url(#g)" mask="url(#eyeL)"/>
      <circle cx="490" cy="365" r="38" fill="url(#g)" mask="url(#eyeR)"/>
      <path d="M 376 410 H 424 C 432 410 435 418 429 425 L 408 446 C 403 451 397 451 392 446 L 371 425 C 365 418 368 410 376 410 Z" fill="#38b6ff"/>
      <path d="M 345 462 C 345 485 375 492 392 475 C 397 470 400 458 400 450 C 400 458 403 470 408 475 C 425 492 455 485 455 462" fill="none" stroke="#38b6ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 175 412 Q 230 398 285 418 M 185 452 Q 235 435 282 438 M 212 492 Q 250 468 285 458" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
      <path d="M 625 412 Q 570 398 515 418 M 615 452 Q 565 435 518 438 M 588 492 Q 550 468 515 458" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
    </g>
  </svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 896;
    c.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.download = 'kotonet-logo.png';
    a.href = c.toDataURL('image/png');
    a.click();
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(svg);
})();
